name: Gala
options:
  bundleIdPrefix: com.nozomi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"

packages:
  GalaKit:
    path: GalaKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  # The same sources as the `gala-cli` SwiftPM product, built here so the app bundle can carry the tool.
  gala-cli:
    type: tool
    platform: macOS
    sources:
      - GalaKit/Sources/gala-cli
    dependencies:
      - package: GalaKit
    settings:
      base:
        PRODUCT_NAME: gala-cli
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  Gala:
    type: application
    platform: macOS
    sources:
      - Gala
    dependencies:
      - package: GalaKit
      - package: Sparkle
      - target: gala-cli
        link: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nozomi.gala
        MARKETING_VERSION: "2.2.0"
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.games"
    info:
      path: Gala/Info.plist
      properties:
        CFBundleDisplayName: Gala
        CFBundleName: Gala
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Sparkle compares CFBundleVersion, so it tracks the marketing version instead of a separate build number.
        CFBundleVersion: $(MARKETING_VERSION)
        SUFeedURL: https://github.com/NozomiX1/Gala/releases/latest/download/appcast.xml
        SUPublicEDKey: KJKBiYQmjLMWF6CDpOk2g4R9gfjaCxD1ri0X22MAVeY=
        SUEnableAutomaticChecks: true
        LSMinimumSystemVersion: "14.0"
