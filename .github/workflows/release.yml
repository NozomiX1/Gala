name: Release

# Pushing a tag like v2.0.0 builds the DMG and the Sparkle update feed and attaches both to the GitHub release.
# Needs the repository secret SPARKLE_PRIVATE_KEY (export it with Sparkle's `generate_keys --account gala -x <file>`).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    # A stuck step should fail the release, not hold the machine for hours.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches project.yml
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"$/\1/p' project.yml)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project.yml version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: swift test --package-path GalaKit

      - name: Build DMG and update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          brew install xcodegen
          scripts/release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Installed copies read releases/latest/download/appcast.xml, so the feed must be an asset of every release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Gala.dmg dist/appcast.xml --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Gala.dmg dist/appcast.xml --title "Gala $VERSION" --notes-file dist/Gala.md
          fi
